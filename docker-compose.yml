services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knowdo
      POSTGRES_PASSWORD: knowdo
      POSTGRES_DB: knowdo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowdo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    # Kept in step with the qdrant-client version in worker/pyproject.toml:
    # the client warns and may misbehave when the minor versions diverge.
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    # No healthcheck: the image ships neither curl nor wget. The Python
    # services restart until it answers, which is the same waiting done
    # in one line instead of five.

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://knowdo:knowdo@postgres:5432/knowdo?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AI_URL: http://ai:8000
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # worker and ai are the same image with different commands: ingestion
  # is bursty and scales on queue depth, /ask is latency-sensitive and
  # scales on request rate.
  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgres://knowdo:knowdo@postgres:5432/knowdo?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  ai:
    build: ./worker
    command: uvicorn knowdo_worker.api:app --host 0.0.0.0 --port 8000
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.moonshot.ai/v1}
      LLM_MODEL: ${LLM_MODEL:-kimi-k2.6}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
    # Internal only: the Go API is the single publicly-routed service.
    expose:
      - "8000"
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started

volumes:
  pgdata:
  qdrantdata:
