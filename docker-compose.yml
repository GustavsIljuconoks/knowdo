services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knowdo
      POSTGRES_PASSWORD: knowdo
      POSTGRES_DB: knowdo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowdo"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://knowdo:knowdo@postgres:5432/knowdo?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
